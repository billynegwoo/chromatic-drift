<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromatic Drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; box-sizing: border-box; }
  canvas { display: block; width: min(100%, calc((100vh - 110px) * 768 / 448)); height: auto; background: #000; outline: none; }
  #hint { font-size: 14px; max-width: 768px; text-align: center; min-height: 2.6em; line-height: 1.3; }
  #help { font-size: 12px; opacity: .55; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="768" height="448" tabindex="0"></canvas>
<div id="hint"></div>
<div id="help"></div>
<script>
'use strict';
// Chromatic Drift — prototype
// Three tile layers (R, G, B) composited additively. One "lens" value k slides
// red by -k tiles and blue by +k tiles along the level's axis (x or y); green
// is the fixed anchor.
//   red   = solid ground (you are red, you collide only with red)
//   green = lethal
//   blue  = water (hold jump to swim)
//   exit  = a door that only exists where all three channels overlap (white)
// Standing on red, the lens carries you. Red moving into you shoves you.
// Levels are authored in screen tile coords as seen at k = 0 (x 0..23, y 0..13);
// grids are PAD tiles larger on every side so layers can slide in from offscreen.
// Everything in `fx` is presentation only and never feeds back into the
// simulation, so the deterministic playtest (index.html?test) is unaffected.
const T = 32, COLS = 24, ROWS = 14, PAD = 4, MW = COLS + PAD * 2, MH = ROWS + PAD * 2;
const W = COLS * T, H = ROWS * T, KMAX = 4, DT = 1 / 120;
const GRAV = 1800, JUMP = 620, SPEED = 170, ACC = 2400;
const LENS_KEY_RATE = 6, LENS_MAX_RATE = 10, ALIGN_TOL = 0.12;
const SPIKE_UP = 1, SPIKE_DOWN = 2, BLOCK = 3;
const SAVE_KEY = 'chromatic-drift.best';
const TEST_MODE = /[?&]test\b/.test(location.search);   // playtest visits every level; don't save that

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint'), helpEl = document.getElementById('help');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Layout-aware key labels (AZERTY shows A/E for the lens, Z to jump, etc.)
const labels = { KeyQ: 'Q', KeyE: 'E', KeyA: 'A', KeyD: 'D', KeyW: 'W', KeyR: 'R', KeyM: 'M' };
const K = c => labels[c] || c;
if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
  navigator.keyboard.getLayoutMap().then(m => {
    for (const c in labels) { const v = m.get(c); if (v) labels[c] = v.toUpperCase(); }
    updateText();
  }).catch(() => {});
}

const grid = () => new Uint8Array(MW * MH);
// Fill a rectangle given in screen tiles at k = 0 (may extend PAD tiles offscreen).
function rect(g, x0, y0, x1, y1, v = 1) {
  for (let y = y0 + PAD; y <= y1 + PAD; y++) for (let x = x0 + PAD; x <= x1 + PAD; x++)
    if (x >= 0 && x < MW && y >= 0 && y < MH) g[y * MW + x] = v;
}
const cell = (g, x, y) => (x < 0 || x >= MW || y < 0 || y >= MH) ? 0 : g[y * MW + x];
// Does the world-space box overlap any tile of grid g drawn at pixel offset (ox, oy)?
function hits(g, ox, oy, x, y, w, h) {
  const x0 = Math.floor((x - ox) / T), x1 = Math.floor((x + w - 0.01 - ox) / T);
  const y0 = Math.floor((y - oy) / T), y1 = Math.floor((y + h - 0.01 - oy) / T);
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) if (cell(g, xx, yy)) return true;
  return false;
}

// axis: which way the lens slides layers. kd: lens value that aligns the exit.
const LEVELS = [
  {
    name: 'LENS', axis: 'x', k0: 0, kd: 2, door: { x: 18, y: 10 }, spawn: { x: 3, y: 11 },
    hint: () => `Turn the lens with ${K('KeyQ')} / ${K('KeyE')} or the mouse wheel. The exit only opens where red, green and blue overlap into white.`,
    build(R, G, B) { rect(R, -4, 12, 27, 17); },
  },
  {
    name: 'LEAP', axis: 'x', k0: 0, kd: 1, door: { x: 21, y: 10 }, spawn: { x: 2, y: 11 },
    hint: () => `On red ground you ride the layer. In mid-air you don't: jump, then turn the lens to slide the far ledge under you. Green is lethal.`,
    build(R, G, B) {
      rect(R, -4, 12, 6, 17);          // left ledge
      rect(R, 13, 12, 27, 17);         // right ledge: 6-tile gap, too far to jump
      rect(G, 14, 11, 15, 11);         // spikes (green never moves)
    },
  },
  {
    name: 'TIDE', axis: 'x', k0: 0, kd: -1, door: { x: 15, y: 4 }, spawn: { x: 2, y: 11 },
    hint: () => `Blue is water: hold jump to swim. Red and blue drift in opposite directions.`,
    build(R, G, B) {
      rect(R, -4, 12, 27, 17);         // floor
      rect(R, 13, 6, 19, 6);           // high ledge
      rect(B, 6, 4, 8, 11);            // water column
      rect(G, 12, 11, 20, 11);         // spike bed under the ledge
    },
  },
  {
    // Starts at k=1 so only +3 is left: enough for one 6-tile gap, not two.
    name: 'RELAY', axis: 'x', k0: 1, kd: 2, door: { x: 21, y: 10 }, spawn: { x: 1, y: 11 },
    hint: () => `The lens only turns so far. While you stand on red, turning it back costs you nothing: you just ride along.`,
    build(R, G, B) {
      rect(R, -4, 12, 3, 17);          // start
      rect(R, 10, 12, 14, 17);         // middle island (6-tile gaps on both sides)
      rect(R, 21, 12, 27, 17);         // exit island
    },
  },
  {
    // The pit is 15 tiles: too wide even with a mid-air lens. Water never carries
    // you, so you swim along while the lens moves the pocket (6 tiles/s vs 5.3 swim).
    // You walk in mid-depth, so there's ~0.5 s of sinking before you'd drop out.
    name: 'FERRY', axis: 'x', k0: -4, kd: 2, door: { x: 20, y: 5 }, spawn: { x: 1, y: 9 },
    hint: () => `Too far to leap. Climb into the water and take it with you. It won't wait if you turn too fast.`,
    build(R, G, B) {
      rect(R, -4, 10, 0, 17);          // start ledge (world 0..4 at k=-4)
      rect(B, 9, 6, 12, 11);           // floating pocket of water, 4 wide
      rect(R, 17, 7, 27, 17);          // far cliff, arrives next to the pocket at k=2
      rect(G, 5, 13, 14, 13);          // spikes along the pit floor
    },
  },
  {
    name: 'LIFT', axis: 'y', k0: 0, kd: 3, door: { x: 20, y: 3 }, spawn: { x: 3, y: 11 },
    hint: () => `This lens turns up and down. Wall too high? Jump, then sink the world under your feet. Mind what hangs overhead before you rise.`,
    build(R, G, B) {
      rect(R, -4, 12, 11, 17);         // floor
      rect(R, 12, 8, 27, 17);          // tower: 4 tiles up, one more than a jump
      rect(G, 12, 0, 16, 3, BLOCK);    // hanging green block...
      rect(G, 12, 4, 16, 4, SPIKE_DOWN); // ...with teeth
    },
  },
  {
    // The landing is offscreen until red rises. Raising it while still on the
    // start ledge lifts you into the teeth, so it has to happen mid-fall.
    name: 'CATCH', axis: 'y', k0: 0, kd: 3, door: { x: 13, y: 10 }, spawn: { x: 1, y: 3 },
    hint: () => `Red pushes, too. Step off into the dark, then bring the floor up to catch you.`,
    build(R, G, B) {
      rect(R, -4, 4, 4, 5);            // start ledge
      rect(G, 0, 0, 5, 0, BLOCK);
      rect(G, 0, 1, 5, 1, SPIKE_DOWN); // teeth one lens step above your head
      rect(R, 7, 15, 15, 17);          // landing, below the screen at k=0
    },
  },
  {
    name: 'FLOOD', axis: 'y', k0: 0, kd: 2, door: { x: 20, y: 2 }, spawn: { x: 3, y: 9 },
    hint: () => `Sinking the red raises the water.`,
    build(R, G, B) {
      rect(R, -4, 10, 7, 17);          // shore
      rect(R, 8, 11, 15, 17);          // pool floor
      rect(B, 8, 9, 15, 17);           // pool
      rect(R, 16, 6, 27, 17);          // cliff, 4 above the shore
      rect(G, 16, 0, 18, 2, BLOCK);
      rect(G, 16, 3, 18, 3, SPIKE_DOWN);
    },
  },
  {
    // Each jump-and-sink climb leaves you ~3 rows higher on screen. Jumping from
    // the second step at k=1 puts your head in the teeth: sink while standing first.
    name: 'STAIRS', axis: 'y', k0: 3, kd: -2, door: { x: 16, y: 2 }, spawn: { x: 2, y: 10 },
    hint: () => `Every climb brings you closer to the teeth. Sink while you stand to make headroom.`,
    build(R, G, B) {
      rect(R, -4, 14, 5, 17);          // floor
      rect(R, 6, 10, 9, 17);           // step 1 (each step 4 rows up)
      rect(R, 10, 6, 13, 17);          // step 2
      rect(R, 14, 2, 27, 17);          // top step with the exit
      rect(G, 6, 0, 13, 0, BLOCK);
      rect(G, 6, 1, 13, 1, SPIKE_DOWN);
    },
  },
  {
    name: 'PRISM', axis: 'x', k0: 0, kd: 2, door: { x: 20, y: 3 }, spawn: { x: 2, y: 11 },
    hint: () => `Everything you've learned, in one room.`,
    build(R, G, B) {
      rect(R, -4, 12, 8, 17);          // start
      rect(B, 4, 3, 6, 11);            // water column
      rect(R, 12, 5, 16, 5);           // first high ledge
      rect(R, 22, 5, 27, 5);           // exit ledge (5-tile gap)
      rect(G, 22, 4, 23, 4);           // spikes past the exit
      rect(G, 9, 13, 21, 13);          // spike pit
    },
  },
];

// Layers are pre-baked once per level.
function makeLayer(g, ch, door) {
  const c = document.createElement('canvas'); c.width = MW * T; c.height = MH * T;
  const x = c.getContext('2d');
  const C = v => ch === 0 ? `rgb(${v},0,0)` : ch === 1 ? `rgb(0,${v},0)` : `rgb(0,0,${v})`;
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const v = cell(g, tx, ty);
    if (!v) continue;
    const px = tx * T, py = ty * T, top = !cell(g, tx, ty - 1);
    if (ch === 0) {            // red: bricks
      x.fillStyle = C(170); x.fillRect(px, py, T, T);
      x.fillStyle = C(70);
      x.fillRect(px, py + T / 2 - 1, T, 2); x.fillRect(px, py + T - 2, T, 2);
      x.fillRect(px + (ty % 2 ? 8 : 24), py, 2, T / 2); x.fillRect(px + (ty % 2 ? 24 : 8), py + T / 2, 2, T / 2);
      if (top) { x.fillStyle = C(255); x.fillRect(px, py, T, 3); }
    } else if (ch === 1) {     // green: spikes or hatched block
      x.fillStyle = C(v === BLOCK ? 45 : 28); x.fillRect(px, py, T, T);
      if (v === BLOCK) {
        x.strokeStyle = C(170); x.lineWidth = 2;
        x.save(); x.beginPath(); x.rect(px, py, T, T); x.clip();
        x.beginPath(); for (let i = -T; i < T; i += 8) { x.moveTo(px + i, py + T); x.lineTo(px + i + T, py); } x.stroke();
        x.restore();
      } else {
        x.fillStyle = C(230);
        const n = 3, w = T / n, down = v === SPIKE_DOWN;
        for (let i = 0; i < n; i++) {
          x.beginPath();
          if (down) { x.moveTo(px + i * w + 1, py); x.lineTo(px + i * w + w / 2, py + T - 6); x.lineTo(px + (i + 1) * w - 1, py); }
          else      { x.moveTo(px + i * w + 1, py + T); x.lineTo(px + i * w + w / 2, py + 6); x.lineTo(px + (i + 1) * w - 1, py + T); }
          x.closePath(); x.fill();
        }
      }
    } else {                   // blue: water
      x.fillStyle = C(110); x.fillRect(px, py, T, T);
      x.strokeStyle = C(230); x.lineWidth = 2;
      for (let r = 0; r < 2; r++) {
        const yy = py + 10 + r * 14; x.beginPath();
        for (let i = 0; i <= T; i += 4) { const w = yy + Math.sin((px + i) / 5) * 2; i ? x.lineTo(px + i, w) : x.moveTo(px + i, w); }
        x.stroke();
      }
      if (top) { x.fillStyle = C(255); x.fillRect(px, py, T, 2); }
    }
  }
  // this channel's third of the exit door
  const px = (door.x + PAD) * T, py = (door.y + PAD) * T;
  x.fillStyle = C(60); x.fillRect(px + 4, py + 4, T - 8, 2 * T - 4);
  x.strokeStyle = C(255); x.lineWidth = 3; x.strokeRect(px + 4.5, py + 4.5, T - 9, 2 * T - 5);
  return c;
}
function makeGlow(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d');
  if (!('filter' in x)) return null;
  x.filter = 'blur(7px)'; x.drawImage(src, 0, 0);
  return c;
}

let li = 0, L = null, k = 0, kT = 0, p = null, state = 'title', stT = 0, deaths = 0, time = 0, runT = 0;
let jumpBuf = 0, resistShake = 0, lastResist = -1, wheelAcc = 0, wheelT = -1, paused = false, deathAt = null;
let wasAligned = false;
// Pixel offset of a layer: s = -1 red, 0 green, +1 blue.
const offs = (s, kk) => [(-PAD + s * kk * L.ax) * T, (-PAD + s * kk * L.ay) * T];

let best = 0;
try { best = clamp(parseInt(localStorage.getItem(SAVE_KEY), 10) || 0, 0, LEVELS.length - 1); } catch (e) { best = 0; }
function saveBest(i) {
  if (TEST_MODE) return;
  best = Math.max(best, i);
  try { localStorage.setItem(SAVE_KEY, String(best)); } catch (e) { /* private mode: progress just isn't kept */ }
}

function loadLevel(i) {
  li = i;
  const d = LEVELS[i], R = grid(), G = grid(), B = grid();
  d.build(R, G, B);
  const ax = d.axis === 'y' ? 0 : 1, ay = 1 - ax;
  // Door thirds sit wherever they need to be so they meet at d.door when k = kd.
  const layers = [
    makeLayer(R, 0, { x: d.door.x + d.kd * ax, y: d.door.y + d.kd * ay }),
    makeLayer(G, 1, d.door),
    makeLayer(B, 2, { x: d.door.x - d.kd * ax, y: d.door.y - d.kd * ay }),
  ];
  L = { ...d, R, G, B, ax, ay, layers, glows: layers.map(makeGlow) };
  saveBest(i);
  fx.intro = 1; fx.banner = 1.8; fx.parts.length = 0;
  resetLevel(); updateText();
}
function resetLevel() {
  k = kT = L.k0;
  p = { w: 20, h: 26, vx: 0, vy: 0, face: 1, grounded: true, coyote: 0, wet: null };
  p.x = L.spawn.x * T + (T - p.w) / 2;
  p.y = (L.spawn.y + 1) * T - p.h;
  state = 'play'; jumpBuf = 0; deathAt = null;
  wasAligned = Math.abs(k - L.kd) < ALIGN_TOL;
  fx.spawn = 0.35; fx.trail.length = 0; fx.kPrev = k; fx.kVel = 0;
}
function startGame(i) { deaths = 0; runT = 0; loadLevel(i); sfx('align'); }
const levelKeys = () => LEVELS.length >= 10 ? '1–9, 0' : `1–${LEVELS.length}`;
function updateText() {
  hintEl.textContent = state === 'title' ? 'A lens-shifting puzzle platformer · GitHub Game Off 2026 · theme: SHIFT'
    : state === 'end' ? 'End of the prototype. Thanks for playing!' : (L ? L.hint() : '');
  helpEl.textContent = `${K('KeyA')}/${K('KeyD')} or ←/→ move · ${K('KeyW')}/↑/Space jump · ${K('KeyQ')}/${K('KeyE')} or wheel: lens · ${K('KeyR')} restart · ${K('KeyM')} mute · ${levelKeys()} level select · Esc title`;
}

const redHit = (x, y, kk = k) => { const [ox, oy] = offs(-1, kk); return hits(L.R, ox, oy, x, y, p.w, p.h); };
const solid = (x, y) => x < 0 || x + p.w > W || redHit(x, y);
function move(axis, d) {               // 1px sub-steps; returns true on collision
  const n = Math.ceil(Math.abs(d)), s = n ? d / n : 0;
  for (let i = 0; i < n; i++) {
    if (axis === 0) { p.x += s; if (solid(p.x, p.y)) { p.x -= s; return true; } }
    else            { p.y += s; if (solid(p.x, p.y)) { p.y -= s; return true; } }
  }
  return false;
}
// Move the lens. Standing on red carries you; red sliding into you shoves you.
// The lens only refuses when that would push you off the screen.
function applyK(nk) {
  const [ox0, oy0] = offs(-1, k), [ox1, oy1] = offs(-1, nk);
  const nx = p.x + ox1 - ox0, ny = p.y + oy1 - oy0;
  const inBounds = nx >= 0 && nx + p.w <= W && ny >= -0.5 && ny + p.h <= H + 0.5;
  if (p.grounded || redHit(p.x, p.y, nk)) {
    if (!inBounds || redHit(nx, ny, nk)) return false;
    p.x = nx; p.y = ny;
  }
  k = nk; return true;
}
function die() {
  deaths++; state = 'dead'; stT = 0.6; deathAt = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
  sfx('die'); juice.die();
}

const keys = new Set();
const JUMP_KEYS = ['KeyW', 'ArrowUp', 'Space'];

function update(dt) {
  time += dt; resistShake = Math.max(0, resistShake - dt); jumpBuf -= dt;
  if (state === 'dead' || state === 'win') {
    stT -= dt;
    if (stT <= 0) {
      if (state === 'dead') resetLevel();
      else if (li + 1 < LEVELS.length) loadLevel(li + 1);
      else { state = 'end'; updateText(); }
    }
    return;
  }
  if (state !== 'play') return;
  runT += dt;

  // lens
  const q = keys.has('KeyQ'), e = keys.has('KeyE');
  if (q && !e) kT += LENS_KEY_RATE * dt;
  else if (e && !q) kT -= LENS_KEY_RATE * dt;
  else kT = Math.round(kT);                       // soft detents on whole tiles
  kT = clamp(kT, -KMAX, KMAX);
  const kBefore = k;
  const dk = clamp(kT - k, -LENS_MAX_RATE * dt, LENS_MAX_RATE * dt);
  if (Math.abs(dk) > 1e-6 && !applyK(k + dk)) {
    kT = k;
    if (q || e || time - wheelT < 0.3) {
      resistShake = 0.18;
      if (time - lastResist > 0.25) { lastResist = time; sfx('resist'); }
    }
  }
  if (k > kBefore ? Math.floor(k) !== Math.floor(kBefore) : k < kBefore && Math.ceil(k) !== Math.ceil(kBefore)) juice.tick(Math.round(k));

  // player
  const left = keys.has('KeyA') || keys.has('ArrowLeft'), right = keys.has('KeyD') || keys.has('ArrowRight');
  const jumpHeld = JUMP_KEYS.some(c => keys.has(c));
  const ax = (right ? 1 : 0) - (left ? 1 : 0);
  p.vx += clamp(ax * SPEED - p.vx, -ACC * dt, ACC * dt);
  if (ax) p.face = ax;
  const [bx, by] = offs(1, k);
  const inWater = hits(L.B, bx, by, p.x + 2, p.y + 2, p.w - 4, p.h - 2);
  if (p.wet !== null && p.wet !== inWater) juice.splash(inWater);
  p.wet = inWater;
  if (inWater) {
    p.vy += GRAV * 0.3 * dt;
    if (jumpHeld) p.vy -= 1500 * dt;
    p.vy = clamp(p.vy, -230, 170);
  } else {
    p.vy += GRAV * dt;
    if (!jumpHeld && p.vy < 0) p.vy += GRAV * 1.2 * dt;   // short hop on early release
    p.vy = Math.min(p.vy, 900);
  }
  p.coyote = p.grounded ? 0.09 : p.coyote - dt;
  if (jumpBuf > 0 && p.coyote > 0 && !inWater) { p.vy = -JUMP; p.coyote = 0; jumpBuf = 0; sfx('jump'); juice.jump(); }
  const wasGrounded = p.grounded, impact = p.vy;
  if (move(0, p.vx * dt)) p.vx = 0;
  if (move(1, p.vy * dt)) p.vy = 0;
  p.grounded = solid(p.x, p.y + 1);
  if (!wasGrounded && p.grounded && impact > 220) juice.land(impact);

  // hazards + exit
  const ins = 4, [gx, gy] = offs(0, k);
  if (hits(L.G, gx, gy, p.x + ins, p.y + ins, p.w - 2 * ins, p.h - ins) || p.y > H) return die();
  const aligned = Math.abs(k - L.kd) < ALIGN_TOL;
  if (aligned && !wasAligned) juice.align();
  wasAligned = aligned;
  if (aligned) {
    const dx = L.door.x * T, dy = L.door.y * T;
    if (p.x < dx + T - 4 && p.x + p.w > dx + 4 && p.y < dy + 2 * T && p.y + p.h > dy + 4) {
      state = 'win'; stT = 1.1; sfx('win'); juice.win();
    }
  }
}

// Presentation-only state. Spawned from sim events, animated on real frame time.
const fx = {
  parts: [], trail: [], shake: 0, flash: 0, flashRGB: '255,255,0', squash: 0, intro: 0, banner: 0,
  spawn: 0, gauge: 0, blink: 0, nextBlink: 2, trailT: 0, kPrev: 0, kVel: 0,
};
const motes = Array.from({ length: 45 }, () => ({
  x: Math.random() * W, y: Math.random() * H, v: 4 + Math.random() * 10, a: 0.04 + Math.random() * 0.08, s: Math.random() < 0.3 ? 2 : 1,
}));
function burst(x, y, n, colors, speed, life, grav, size) {
  for (let i = 0; i < n && fx.parts.length < 500; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    fx.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, c: colors[i % colors.length], g: grav, size });
  }
}
const doorCenter = () => [L.door.x * T + T / 2, L.door.y * T + T];
const juice = {
  jump() { fx.squash = -0.3; burst(p.x + p.w / 2, p.y + p.h, 5, ['255,40,40'], 60, 0.25, 200, 2); },
  land(v) {
    fx.squash = Math.min(0.45, v / 1500);
    burst(p.x + p.w / 2, p.y + p.h, Math.round(3 + v / 90), ['255,70,70', '150,0,0'], 70, 0.35, 160, 2);
    sfx('land', v);
  },
  splash(into) {
    burst(p.x + p.w / 2, p.y + (into ? p.h * 0.4 : p.h), 14, ['70,70,255', '150,150,255'], 140, 0.5, 500, 2);
    sfx('splash');
  },
  tick(v) { fx.gauge = 1; sfx('tick', v); },
  align() { const [x, y] = doorCenter(); burst(x, y, 36, ['255,255,255', '255,0,0', '0,255,0', '0,0,255'], 180, 0.8, -30, 2); sfx('align'); },
  die() {
    fx.shake = 0.35; fx.flash = 1; fx.flashRGB = '255,255,0';
    burst(p.x + p.w / 2, p.y + p.h / 2, 50, ['255,255,0', '255,0,0', '0,255,0'], 260, 0.9, 400, 3);
  },
  win() {
    const [x, y] = doorCenter();
    fx.flash = 0.6; fx.flashRGB = '255,255,255';
    burst(x, y, 70, ['255,255,255', '255,0,0', '0,255,0', '0,0,255'], 320, 1.1, -60, 3);
  },
};
function updateFx(dt) {
  fx.shake = Math.max(0, fx.shake - dt); fx.flash = Math.max(0, fx.flash - dt * 2.5);
  fx.gauge = Math.max(0, fx.gauge - dt * 5); fx.intro = Math.max(0, fx.intro - dt / 0.6);
  fx.banner = Math.max(0, fx.banner - dt); fx.spawn = Math.max(0, fx.spawn - dt);
  fx.squash *= Math.exp(-dt * 14);
  fx.blink = Math.max(0, fx.blink - dt);
  if ((fx.nextBlink -= dt) <= 0) { fx.blink = 0.12; fx.nextBlink = 2 + Math.random() * 3; }
  fx.kVel += ((k - fx.kPrev) / Math.max(dt, 1e-3) - fx.kVel) * Math.min(1, dt * 20); fx.kPrev = k;
  for (const m of motes) { m.y -= m.v * dt; if (m.y < -2) { m.y = H + 2; m.x = Math.random() * W; } }
  if (p && L && state === 'play') {
    if (!p.grounded && (fx.trailT -= dt) <= 0) {
      fx.trail.push({ x: p.x, y: p.y, life: 0.22, a: Math.abs(fx.kVel) > 1 ? 0.5 : 0.16 });
      fx.trailT = 0.03;
    }
    if (p.wet && Math.random() < dt * 6) {
      fx.parts.push({ x: p.x + p.w / 2 + (Math.random() - 0.5) * 8, y: p.y + 4, vx: 0, vy: -30, life: 0.8, max: 0.8, c: '130,130,255', g: -40, size: 2 });
    }
    if (Math.abs(k - L.kd) < ALIGN_TOL && Math.random() < dt * 14) {
      fx.parts.push({ x: L.door.x * T + 4 + Math.random() * (T - 8), y: L.door.y * T + 2 * T, vx: 0, vy: -40 - Math.random() * 40, life: 1, max: 1, c: '255,255,255', g: 0, size: 2 });
    }
  }
  fx.trail = fx.trail.filter(t => (t.life -= dt) > 0);
  fx.parts = fx.parts.filter(q => {
    q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.98;
    return q.life > 0;
  });
}

const scanTile = document.createElement('canvas'); scanTile.width = 1; scanTile.height = 3;
scanTile.getContext('2d').fillStyle = 'rgba(0,0,0,0.16)'; scanTile.getContext('2d').fillRect(0, 2, 1, 1);
const scanlines = ctx.createPattern(scanTile, 'repeat');
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); ctx.fill(); }

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
  const sh = fx.shake * 26;
  ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  drawBackdrop();
  if (state === 'title') drawTitle();
  else if (state === 'end') drawEnd();
  else {
    drawLayers(); drawDoorFx(); drawTrail(); drawPlayer(); drawParticles();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHUD();
    if (fx.banner > 0) drawBanner();
    if (state === 'win') splitText('ALIGNED', 44, H / 2 - 40, Math.max(0, stT - 0.7) * 30);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (fx.flash > 0) { ctx.fillStyle = `rgba(${fx.flashRGB},${fx.flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = scanlines; ctx.fillRect(0, 0, W, H);
  vignette();
}

function drawBackdrop() {
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += T) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += T) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
  for (const m of motes) { ctx.fillStyle = `rgba(255,255,255,${m.a})`; ctx.fillRect(m.x, m.y, m.s, m.s); }
}

function drawLayers() {
  const ease = fx.intro * fx.intro, spread = ease * 1.5, alpha = 1 - ease;
  const jit = state === 'dead' ? (stT / 0.6) * 7 : 0;
  const o = [offs(-1, k + spread), offs(0, k), offs(1, k + spread)];
  ctx.globalCompositeOperation = 'lighter';
  L.glows.forEach((g, i) => {
    if (!g) return;
    ctx.globalAlpha = alpha * (i === 1 ? 0.4 + 0.2 * Math.sin(time * 4) : 0.55);
    ctx.drawImage(g, o[i][0], o[i][1]);
  });
  // motion smear on the sliding layers while the lens turns
  if (Math.abs(fx.kVel) > 0.5) {
    for (const [i, s] of [[0, -1], [2, 1]]) for (const [lag, a] of [[0.04, 0.28], [0.08, 0.12]]) {
      const [gx, gy] = offs(s, k - fx.kVel * lag);
      ctx.globalAlpha = a * alpha; ctx.drawImage(L.layers[i], gx, gy);
    }
  }
  ctx.globalAlpha = alpha;
  L.layers.forEach((c, i) => ctx.drawImage(c, o[i][0] + (Math.random() - 0.5) * jit, o[i][1] + (Math.random() - 0.5) * jit));
  ctx.globalAlpha = 1;
}

function drawDoorFx() {
  const d = Math.abs(k - L.kd), near = clamp(1 - d / 1.5, 0, 1), dx = L.door.x * T, dy = L.door.y * T;
  ctx.globalCompositeOperation = 'lighter';
  if (near > 0) { ctx.fillStyle = `rgba(255,255,255,${0.07 * near})`; ctx.fillRect(dx - 10, dy - 10, T + 20, 2 * T + 20); }
  if (d < ALIGN_TOL || state === 'win') {
    const beam = ctx.createLinearGradient(0, dy + 4, 0, 0);
    beam.addColorStop(0, 'rgba(255,255,255,0.16)'); beam.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = beam; ctx.fillRect(dx + 6, 0, T - 12, dy + 4);
    const grow = state === 'win' ? (1.1 - stT) * 60 : 0;
    ctx.fillStyle = `rgba(255,255,255,${0.10 + 0.06 * Math.sin(time * 6)})`;
    ctx.fillRect(dx - 6 - grow, dy - 6 - grow, T + 12 + grow * 2, 2 * T + 12 + grow * 2);
  }
}

function drawTrail() {
  ctx.globalCompositeOperation = 'lighter';
  for (const t of fx.trail) { ctx.fillStyle = `rgba(255,0,0,${(t.life / 0.22) * t.a})`; rr(t.x, t.y, p.w, p.h, 5); }
}

function drawPlayer() {
  if (state === 'dead') {
    const t = 0.6 - stT;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,255,0,${Math.max(0, 1 - t / 0.6)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(deathAt.x, deathAt.y, 6 + t * 90, 0, Math.PI * 2); ctx.stroke();
    return;
  }
  const sq = fx.squash, w = p.w * (1 + sq * 0.7), h = p.h * (1 - sq);
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  ctx.globalCompositeOperation = 'lighter';
  const s = fx.spawn / 0.35;
  if (s > 0) {                       // materialize: two ghosts converge onto the spawn
    const d = s * s * 40;
    ctx.fillStyle = `rgba(255,0,0,${0.5 * s})`;
    rr(x - d * L.ax, y - d * L.ay, w, h, 5); rr(x + d * L.ax, y + d * L.ay, w, h, 5);
  }
  ctx.fillStyle = `rgba(255,0,0,${1 - s * 0.7})`;
  rr(x, y, w, h, 5);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  const ex = x + w / 2 + p.face * 3, eh = fx.blink > 0 ? 1 : 6, ey = y + 7 * (h / p.h) + (6 - eh) / 2;
  ctx.fillRect(ex - 5, ey, 3, eh); ctx.fillRect(ex + 2, ey, 3, eh);
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const q of fx.parts) { ctx.fillStyle = `rgba(${q.c},${q.life / q.max})`; ctx.fillRect(q.x, q.y, q.size, q.size); }
}

function drawHUD() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '12px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.textAlign = 'left';  ctx.fillText(`${li + 1}/${LEVELS.length}  ${L.name}`, 12, 20);
  ctx.textAlign = 'right'; ctx.fillText(`deaths ${deaths}`, W - 12, 20);
  // lens gauge: where red and blue sit relative to green, drawn along the level's axis
  const sh = resistShake > 0 ? Math.sin(time * 90) * 4 * (resistShake / 0.18) : 0, u = 14, span = KMAX * u;
  const vert = L.ay === 1;
  const cx = vert ? 24 + sh : W / 2 + sh, cy = vert ? H / 2 : 20;
  const at = v => vert ? [cx, cy + v * u] : [cx + v * u, cy];
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  vert ? rr(cx - 11, cy - span - 11, 22, span * 2 + 22, 11) : rr(cx - span - 11, cy - 11, span * 2 + 22, 22, 11);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
  const [a0, a1] = [at(-KMAX), at(KMAX)];
  ctx.moveTo(a0[0] + .5, a0[1] + .5); ctx.lineTo(a1[0] + .5, a1[1] + .5);
  for (let i = -KMAX; i <= KMAX; i++) {
    const [tx, ty] = at(i);
    if (vert) { ctx.moveTo(tx - 3, ty + .5); ctx.lineTo(tx + 4, ty + .5); }
    else      { ctx.moveTo(tx + .5, ty - 3); ctx.lineTo(tx + .5, ty + 4); }
  }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  const r = 5 + fx.gauge * 2.5;
  [[-k, '#f00'], [0, '#0f0'], [k, '#00f']].forEach(([v, c]) => {
    const [dx, dy] = at(v);
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

// Text drawn three times in R, G and B, `split` px apart: white when converged.
function splitText(s, size, y, split, alpha = 1) {
  ctx.font = `bold ${size}px ui-monospace, Menlo, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
  [['#f00', -1], ['#0f0', 0], ['#00f', 1]].forEach(([c, m]) => { ctx.fillStyle = c; ctx.fillText(s, W / 2 + m * split, y); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawBanner() {
  const a = clamp(fx.banner / 0.6, 0, 1), split = Math.max(0, fx.banner - 1.2) * 24 + 1.5;
  splitText(L.name, 40, H * 0.3, split, a * 0.9);
  ctx.font = '12px ui-monospace, Menlo, monospace'; ctx.fillStyle = `rgba(255,255,255,${0.5 * a})`;
  ctx.fillText(`${li + 1} / ${LEVELS.length}`, W / 2, H * 0.3 + 34);
}

function drawTitle() {
  // three light discs drifting apart and back together, white where they overlap
  ctx.globalCompositeOperation = 'lighter';
  const d = 26 + Math.sin(time * 0.8) * 22, cx = W / 2, cy = H / 2 - 20;
  [['rgba(255,0,0,0.45)', -Math.PI / 2], ['rgba(0,255,0,0.45)', Math.PI / 6], ['rgba(0,0,255,0.45)', Math.PI * 5 / 6]].forEach(([c, a]) => {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 78, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  splitText('CHROMATIC DRIFT', 46, cy, 3 + Math.sin(time * 1.3) * 3);
  ctx.font = '13px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('shift the light. walk on red.', W / 2, cy + 42);
  if (Math.sin(time * 4) > -0.4) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(best > 0 ? `press any key to continue · ${best + 1} ${LEVELS[best].name}` : 'press any key to start', W / 2, H - 92);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText(`or ${levelKeys()} to pick a level`, W / 2, H - 70);
}

function drawEnd() {
  splitText('CHROMATIC DRIFT', 40, H / 2 - 30, Math.sin(time * 1.5) * 4);
  ctx.font = '14px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const mm = Math.floor(runT / 60), ss = String(Math.floor(runT % 60)).padStart(2, '0');
  ctx.fillText(`prototype complete · ${mm}:${ss} · deaths: ${deaths}`, W / 2, H / 2 + 20);
  ctx.fillText(`press ${K('KeyR')} to play again`, W / 2, H / 2 + 44);
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.65);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Audio: an A-major pad whose red/blue voices detune with lens misalignment, plus sfx.
let ac = null, master = null, voices = [], muted = false, noiseBuf = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(master);
  const pad = ac.createGain(); pad.gain.value = 0; pad.connect(lp);
  pad.gain.setTargetAtTime(1, ac.currentTime, 0.8);
  [220, 277.18, 329.63].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i === 1 ? 'sine' : 'triangle'; o.frequency.value = f;
    const g = ac.createGain(); g.gain.value = 0.05; o.connect(g); g.connect(pad); o.start(); voices.push(o);
  });
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function updateAudio() {
  if (!ac || !L || voices.length < 3) return;
  const d = k - L.kd, t = ac.currentTime;
  voices[0].detune.setTargetAtTime(-d * 45, t, 0.04);
  voices[2].detune.setTargetAtTime(d * 45, t, 0.04);
}
function tone(f0, f1, dur, wave, vol, delay = 0) {
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = wave; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol) {
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(type, v = 0) {
  if (!ac || muted || ac.state !== 'running') return;
  if (type === 'jump') tone(420, 700, 0.12, 'square', 0.035);
  else if (type === 'land') { tone(160, 60, 0.09, 'sine', clamp(v / 900, 0.02, 0.09)); noise(0.06, 500, 0.03); }
  else if (type === 'splash') { noise(0.3, 900, 0.08); tone(520, 220, 0.15, 'sine', 0.02); }
  else if (type === 'tick') tone(900 + v * 60, 900 + v * 60, 0.035, 'sine', 0.025);
  else if (type === 'align') [1318.5, 1661.2, 1975.5].forEach((f, i) => tone(f, f, 0.5, 'sine', 0.03, i * 0.05));
  else if (type === 'die') { tone(300, 50, 0.4, 'sawtooth', 0.07); noise(0.35, 300, 0.08); }
  else if (type === 'resist') tone(110, 90, 0.05, 'square', 0.05);
  else if (type === 'win') [440, 554.37, 659.25, 880].forEach((f, i) => tone(f, f, 0.25, 'triangle', 0.08, i * 0.08));
}

const IGNORED_ON_TITLE = ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight', 'Tab', 'Escape'];
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  const m = /^Digit([0-9])$/.exec(e.code), n = m ? (m[1] === '0' ? 10 : +m[1]) : 0;
  const pick = n && n <= LEVELS.length ? n - 1 : null;
  if (state === 'title') {
    if (!IGNORED_ON_TITLE.includes(e.code)) startGame(pick !== null ? pick : best);
    return;
  }
  keys.add(e.code);
  if (JUMP_KEYS.includes(e.code)) jumpBuf = 0.12;
  if (e.code === 'Escape') { state = 'title'; keys.clear(); updateText(); return; }
  if (e.code === 'KeyR') { if (state === 'end') startGame(0); else if (state === 'play') resetLevel(); }
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; }
  if (pick !== null) loadLevel(pick);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
cv.addEventListener('wheel', e => {
  e.preventDefault(); initAudio();
  // One lens step per wheel notch (deltaY ~100), trackpads accumulate; short cooldown
  // so a single notch never counts twice.
  wheelAcc += e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  if (Math.abs(wheelAcc) >= 40 && time - wheelT > 0.07) {
    const s = Math.sign(wheelAcc); wheelAcc = 0; wheelT = time;
    // horizontal: scroll down pushes red left; vertical: scroll down sinks red
    kT = clamp(Math.round(kT) + (L && L.ay ? -s : s), -KMAX, KMAX);
  }
}, { passive: false });
cv.addEventListener('pointerdown', () => { initAudio(); cv.focus(); if (state === 'title') startGame(best); });

let last = performance.now(), acc = 0;
function frame(now) {
  const rdt = Math.min(0.1, (now - last) / 1000);
  acc += rdt; last = now;
  if (!paused) while (acc >= DT) { update(DT); acc -= DT; } else acc = 0;
  updateFx(rdt); render(); updateAudio();
  requestAnimationFrame(frame);
}
updateText();
requestAnimationFrame(frame);

// Debug/test hook: drive the sim deterministically from the console.
window.CD = {
  get k() { return k; }, get kT() { return kT; }, get p() { return p; }, get state() { return state; },
  get li() { return li; }, get deaths() { return deaths; }, get axis() { return L.axis; },
  get names() { return LEVELS.map(l => l.name); },
  press(c) { keys.add(c); if (JUMP_KEYS.includes(c)) jumpBuf = 0.12; }, release(c) { keys.delete(c); },
  lens(v) { kT = v; }, step(n = 1) { for (let i = 0; i < n; i++) update(DT); }, load: loadLevel,
  pause(v = true) { paused = v; keys.clear(); },
};
// index.html?test runs the automated playtest (playtest.js) against every level.
if (TEST_MODE) {
  const s = document.createElement('script'); s.src = 'playtest.js'; document.body.appendChild(s);
}
</script>
</body>
