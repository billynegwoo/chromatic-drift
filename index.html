<script type="x-shader/x-fragment" id="glsl-lib">
// Bundled from shader-skills (MIT): https://github.com/gokayfem/shader-skills
// ---- shader-skills library: common ----
const float TAU = 6.28318530717959;

// ---- shader-skills library: hash ----
// PCG-style 1D integer hash.
uint pcgHash(uint v) {
    uint state = v * 747796405u + 2891336453u;
    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
    return (word >> 22u) ^ word;
}
// 3D integer hash, three decorrelated outputs.
uvec3 pcg3d(uvec3 v) {
    v = v * 1664525u + 1013904223u;
    v.x += v.y * v.z;
    v.y += v.z * v.x;
    v.z += v.x * v.y;
    v ^= v >> 16u;
    v.x += v.y * v.z;
    v.y += v.z * v.x;
    v.z += v.x * v.y;
    return v;
}
// Map a uint to [0,1) using the top 24 bits, so the result can never round up to 1.0.
float uintToUnit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }
vec2 uintToUnit(uvec2 h) { return vec2(h >> 8u) * (1.0 / 16777216.0); }
vec3 uintToUnit(uvec3 h) { return vec3(h >> 8u) * (1.0 / 16777216.0); }
vec4 uintToUnit(uvec4 h) { return vec4(h >> 8u) * (1.0 / 16777216.0); }
// Random float in [0,1) for an integer-valued 2D input.
float hash12(vec2 p) {
    uvec2 q = uvec2(ivec2(floor(p)));
    return uintToUnit(pcgHash(q.x + pcgHash(q.y)));
}
// Random vec3 in [0,1)^3 for an integer-valued 3D input.
vec3 hash33(vec3 p) { return uintToUnit(pcg3d(uvec3(ivec3(floor(p))))); }

// ---- shader-skills library: noise ----
// Quintic fade 6t^5 - 15t^4 + 10t^3: C2-continuous interpolation weights for lattice noise.
vec2 quinticFade(vec2 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }
vec3 quinticFade(vec3 f) { return f * f * f * (f * (f * 6.0 - 15.0) + 10.0); }
// Derivative of quinticFade: 30 t^2 (t - 1)^2.
vec2 quinticFadeDeriv(vec2 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }
vec3 quinticFadeDeriv(vec3 f) { return 30.0 * f * f * (f * (f - 2.0) + 1.0); }
// Unit gradient for a 2D lattice point.
vec2 latticeGradient(vec2 cell) {
    float a = TAU * hash12(cell);
    return vec2(cos(a), sin(a));
}
// 2D gradient (Perlin-style) noise with analytic derivatives. Returns vec3(value, d/dx, d/dy). Gradient noise has less grid-aligned blockiness than value noise. Prefer it for fBm.
vec3 gradientNoiseD(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = quinticFade(f), du = quinticFadeDeriv(f);
    vec2 ga = latticeGradient(i);
    vec2 gb = latticeGradient(i + vec2(1.0, 0.0));
    vec2 gc = latticeGradient(i + vec2(0.0, 1.0));
    vec2 gd = latticeGradient(i + vec2(1.0, 1.0));
    float va = dot(ga, f);
    float vb = dot(gb, f - vec2(1.0, 0.0));
    float vc = dot(gc, f - vec2(0.0, 1.0));
    float vd = dot(gd, f - vec2(1.0, 1.0));
    float k = va - vb - vc + vd;
    float value = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;
    vec2 deriv = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)
               + du * (vec2(vb - va, vc - va) + u.yx * k);
    return vec3(value, deriv);
}
// 2D gradient noise.
float gradientNoise(vec2 p) { return gradientNoiseD(p).x; }
// Dot product of a hashed 3D gradient with the offset to its lattice corner.
float latticeGradDot(vec3 cell, vec3 corner, vec3 f) {
    vec3 g = hash33(cell + corner) * 2.0 - 1.0;
    return dot(g, f - corner);
}
// 3D gradient noise.
float gradientNoise(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    vec3 u = quinticFade(f);
    return mix(mix(mix(latticeGradDot(i, vec3(0, 0, 0), f), latticeGradDot(i, vec3(1, 0, 0), f), u.x),
                   mix(latticeGradDot(i, vec3(0, 1, 0), f), latticeGradDot(i, vec3(1, 1, 0), f), u.x), u.y),
               mix(mix(latticeGradDot(i, vec3(0, 0, 1), f), latticeGradDot(i, vec3(1, 0, 1), f), u.x),
                   mix(latticeGradDot(i, vec3(0, 1, 1), f), latticeGradDot(i, vec3(1, 1, 1), f), u.x), u.y), u.z);
}
// 3D gradient noise with analytic derivatives. Returns vec4(value, d/dx, d/dy, d/dz); value equals gradientNoise(p). The trilinear blend is expanded as a polynomial in the fade weights, so the gradient is the same blend of the corner gradients plus the chain-rule term of the fade.
vec4 gradientNoiseD(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    vec3 u = quinticFade(f), du = quinticFadeDeriv(f);
    vec3 g000 = hash33(i) * 2.0 - 1.0;
    vec3 g100 = hash33(i + vec3(1, 0, 0)) * 2.0 - 1.0;
    vec3 g010 = hash33(i + vec3(0, 1, 0)) * 2.0 - 1.0;
    vec3 g110 = hash33(i + vec3(1, 1, 0)) * 2.0 - 1.0;
    vec3 g001 = hash33(i + vec3(0, 0, 1)) * 2.0 - 1.0;
    vec3 g101 = hash33(i + vec3(1, 0, 1)) * 2.0 - 1.0;
    vec3 g011 = hash33(i + vec3(0, 1, 1)) * 2.0 - 1.0;
    vec3 g111 = hash33(i + vec3(1, 1, 1)) * 2.0 - 1.0;
    float v000 = dot(g000, f);
    float v100 = dot(g100, f - vec3(1, 0, 0));
    float v010 = dot(g010, f - vec3(0, 1, 0));
    float v110 = dot(g110, f - vec3(1, 1, 0));
    float v001 = dot(g001, f - vec3(0, 0, 1));
    float v101 = dot(g101, f - vec3(1, 0, 1));
    float v011 = dot(g011, f - vec3(0, 1, 1));
    float v111 = dot(g111, f - vec3(1, 1, 1));
    // value = v000 + kx u.x + ky u.y + kz u.z + kxy u.x u.y + kyz u.y u.z + kzx u.z u.x + kxyz u.x u.y u.z
    float kx = v100 - v000, ky = v010 - v000, kz = v001 - v000;
    float kxy = v000 - v100 - v010 + v110;
    float kyz = v000 - v010 - v001 + v011;
    float kzx = v000 - v100 - v001 + v101;
    float kxyz = -v000 + v100 + v010 - v110 + v001 - v101 - v011 + v111;
    float value = v000 + kx * u.x + ky * u.y + kz * u.z
                + kxy * u.x * u.y + kyz * u.y * u.z + kzx * u.z * u.x + kxyz * u.x * u.y * u.z;
    vec3 grad = g000 + (g100 - g000) * u.x + (g010 - g000) * u.y + (g001 - g000) * u.z
              + (g000 - g100 - g010 + g110) * u.x * u.y
              + (g000 - g010 - g001 + g011) * u.y * u.z
              + (g000 - g100 - g001 + g101) * u.z * u.x
              + (-g000 + g100 + g010 - g110 + g001 - g101 - g011 + g111) * u.x * u.y * u.z
              + du * vec3(kx + kxy * u.y + kzx * u.z + kxyz * u.y * u.z,
                          ky + kxy * u.x + kyz * u.z + kxyz * u.x * u.z,
                          kz + kyz * u.y + kzx * u.x + kxyz * u.x * u.y);
    return vec4(value, grad);
}
const int FBM_MAX_OCTAVES = 12;
// Fractional Brownian motion over 2D gradient noise. Each octave is rotated to hide lattice alignment. persistence 0.5 is the classic look (H = 1). Lower is smoother, higher is rougher.
float fbm(vec2 p, int octaves, float lacunarity, float persistence) {
    const mat2 octaveRotation = mat2(0.8, 0.6, -0.6, 0.8);
    float sum = 0.0, amp = 1.0, norm = 0.0;
    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {
        if (i >= octaves) break;
        sum += amp * gradientNoise(p);
        norm += amp;
        amp *= persistence;
        p = lacunarity * (octaveRotation * p) + vec2(17.13, -3.71);
    }
    return 1.4 * sum / norm;
}
// 2D fBm with the usual defaults (lacunarity 2.01 so octave peaks never re-align, persistence 0.5).
float fbm(vec2 p, int octaves) { return fbm(p, octaves, 2.01, 0.5); }
// fBm over 3D gradient noise.
float fbm(vec3 p, int octaves, float lacunarity, float persistence) {
    const mat3 octaveRotation = mat3(0.00, 0.80, 0.60,
                                     -0.80, 0.36, -0.48,
                                     -0.60, -0.48, 0.64);
    float sum = 0.0, amp = 1.0, norm = 0.0;
    for (int i = 0; i < FBM_MAX_OCTAVES; i++) {
        if (i >= octaves) break;
        sum += amp * gradientNoise(p);
        norm += amp;
        amp *= persistence;
        p = lacunarity * (octaveRotation * p) + vec3(17.13, -3.71, 5.29);
    }
    return sum / norm;
}

<script>
'use strict';
// Chromatic Drift — prototype
// Three tile layers (R, G, B) composited additively. One "lens" value k slides
// red by -k tiles and blue by +k tiles along the level's axis (x or y); green
// is the fixed anchor.
//   red   = solid ground (you are red, you collide only with red)
//   green = lethal
//   blue  = water (hold jump to swim)
//   exit  = a door that only exists where all three channels overlap (white)
// Standing on red, the lens carries you. Red moving into you shoves you.
// Levels are authored in screen tile coords as seen at k = 0 (x 0..23, y 0..13);
// grids are PAD tiles larger on every side so layers can slide in from offscreen.
// Everything in `fx` is presentation only and never feeds back into the
// simulation, so the deterministic playtest (index.html?test) is unaffected.
const T = 32, COLS = 24, ROWS = 14, PAD = 4, MW = COLS + PAD * 2, MH = ROWS + PAD * 2;
const W = COLS * T, H = ROWS * T, KMAX = 4, DT = 1 / 120;
const GRAV = 1800, JUMP = 620, SPEED = 170, ACC = 2400;
const LENS_KEY_RATE = 6, LENS_MAX_RATE = 10, ALIGN_TOL = 0.12;
const SPIKE_UP = 1, SPIKE_DOWN = 2, BLOCK = 3;
const SAVE_KEY = 'chromatic-drift.best', FILING_KEY = 'chromatic-drift.filing', MUTE_KEY = 'chromatic-drift.muted';
const TEST_MODE = /[?&]test\b/.test(location.search);   // playtest visits every level; don't save that
const ST = new Set(new URLSearchParams(location.search).getAll('__state').flatMap(v => v.split(',')));
const FRAMES = ST.has('frames'), DEMO = /[?&]demo\b/.test(location.search), GL_OFF = ST.has('gl-off'), POST_OFF = ST.has('post-off');
// ?validate: the continuation's validator (endless.js), run headless in a hidden iframe: the sim only, nothing drawn,
// nothing stored, no frame loop. It steps generated sheets through their solutions and reports back by postMessage.
const VALIDATE = /[?&]validate\b/.test(location.search);

if (TEST_MODE) document.documentElement.classList.add('test');
const cv = document.getElementById('c'), ctx0 = cv.getContext('2d', { alpha: false });
let ctx = ctx0;                                         // swapped to an offscreen sheet while one is pulled off
const hintEl = document.getElementById('hint'), helpEl = document.getElementById('help');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Layout-aware key labels (AZERTY shows A/E for the lens, Z to jump, etc.)
const labels = { KeyQ: 'Q', KeyE: 'E', KeyA: 'A', KeyD: 'D', KeyW: 'W', KeyR: 'R', KeyM: 'M', KeyS: 'S', KeyC: 'C' };
const K = c => labels[c] || c;
if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
  navigator.keyboard.getLayoutMap().then(m => {
    for (const c in labels) { const v = m.get(c); if (v) labels[c] = v.toUpperCase(); }
    updateText();
  }).catch(() => {});
}

const grid = () => new Uint8Array(MW * MH);
// Fill a rectangle given in screen tiles at k = 0 (may extend PAD tiles offscreen).
function rect(g, x0, y0, x1, y1, v = 1) {
  for (let y = y0 + PAD; y <= y1 + PAD; y++) for (let x = x0 + PAD; x <= x1 + PAD; x++)
    if (x >= 0 && x < MW && y >= 0 && y < MH) g[y * MW + x] = v;
}
const cell = (g, x, y) => (x < 0 || x >= MW || y < 0 || y >= MH) ? 0 : g[y * MW + x];
// Does the world-space box overlap any tile of grid g drawn at pixel offset (ox, oy)?
function hits(g, ox, oy, x, y, w, h) {
  const x0 = Math.floor((x - ox) / T), x1 = Math.floor((x + w - 0.01 - ox) / T);
  const y0 = Math.floor((y - oy) / T), y1 = Math.floor((y + h - 0.01 - oy) / T);
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) if (cell(g, xx, yy)) return true;
  return false;
}

// axis: which way the lens slides layers. kd: lens value that aligns the exit. kmax (optional): the lens's travel,
// +-KMAX when absent (the ten sheets below); the continuation's sheets narrow it.
const LEVELS = [
  {
    name: 'LENS', axis: 'x', k0: 0, kd: 2, door: { x: 18, y: 10 }, spawn: { x: 3, y: 11 },
    hint: () => `Turn the lens with ${K('KeyQ')} / ${K('KeyE')} or the mouse wheel. The exit only opens where red, green and blue overlap into white.`,
    build(R, G, B) { rect(R, -4, 12, 27, 17); },
  },
  {
    name: 'LEAP', axis: 'x', k0: 0, kd: 1, door: { x: 21, y: 10 }, spawn: { x: 2, y: 11 },
    hint: () => `On red ground you ride the layer. In mid-air you don't: jump, then turn the lens to slide the far ledge under you. Green is lethal.`,
    build(R, G, B) {
      rect(R, -4, 12, 6, 17);          // left ledge
      rect(R, 13, 12, 27, 17);         // right ledge: 6-tile gap, too far to jump
      rect(G, 14, 11, 15, 11);         // spikes (green never moves)
    },
  },
  {
    name: 'TIDE', axis: 'x', k0: 0, kd: -1, door: { x: 15, y: 4 }, spawn: { x: 2, y: 11 },
    hint: () => `Blue is water: hold jump to swim. Red and blue drift in opposite directions.`,
    build(R, G, B) {
      rect(R, -4, 12, 27, 17);         // floor
      rect(R, 13, 6, 19, 6);           // high ledge
      rect(B, 6, 4, 8, 11);            // water column
      rect(G, 12, 11, 20, 11);         // spike bed under the ledge
    },
  },
  {
    // Starts at k=1 so only +3 is left: enough for one 6-tile gap, not two.
    name: 'RELAY', axis: 'x', k0: 1, kd: 2, door: { x: 21, y: 10 }, spawn: { x: 1, y: 11 },
    hint: () => `The lens only turns so far. While you stand on red, turning it back costs you nothing: you just ride along.`,
    build(R, G, B) {
      rect(R, -4, 12, 3, 17);          // start
      rect(R, 10, 12, 14, 17);         // middle island (6-tile gaps on both sides)
      rect(R, 21, 12, 27, 17);         // exit island
    },
  },
  {
    // The pit is 15 tiles: too wide even with a mid-air lens. Water never carries
    // you, so you swim along while the lens moves the pocket (6 tiles/s vs 5.3 swim).
    // You walk in mid-depth, so there's ~0.5 s of sinking before you'd drop out.
    name: 'FERRY', axis: 'x', k0: -4, kd: 2, door: { x: 20, y: 5 }, spawn: { x: 1, y: 9 },
    hint: () => `Too far to leap. Climb into the water and take it with you. It won't wait if you turn too fast.`,
    build(R, G, B) {
      rect(R, -4, 10, 0, 17);          // start ledge (world 0..4 at k=-4)
      rect(B, 9, 6, 12, 11);           // floating pocket of water, 4 wide
      rect(R, 17, 7, 27, 17);          // far cliff, arrives next to the pocket at k=2
      rect(G, 5, 13, 14, 13);          // spikes along the pit floor
    },
  },
  {
    name: 'LIFT', axis: 'y', k0: 0, kd: 3, door: { x: 20, y: 3 }, spawn: { x: 3, y: 11 },
    hint: () => `This lens turns up and down. Wall too high? Jump, then sink the world under your feet. Mind what hangs overhead before you rise.`,
    build(R, G, B) {
      rect(R, -4, 12, 11, 17);         // floor
      rect(R, 12, 8, 27, 17);          // tower: 4 tiles up, one more than a jump
      rect(G, 12, 0, 16, 3, BLOCK);    // hanging green block...
      rect(G, 12, 4, 16, 4, SPIKE_DOWN); // ...with teeth
    },
  },
  {
    // The landing is offscreen until red rises. Raising it while still on the
    // start ledge lifts you into the teeth, so it has to happen mid-fall.
    name: 'CATCH', axis: 'y', k0: 0, kd: 3, door: { x: 13, y: 10 }, spawn: { x: 1, y: 3 },
    hint: () => `Red pushes, too. Step off into the dark, then bring the floor up to catch you.`,
    build(R, G, B) {
      rect(R, -4, 4, 4, 5);            // start ledge
      rect(G, 0, 0, 5, 0, BLOCK);
      rect(G, 0, 1, 5, 1, SPIKE_DOWN); // teeth one lens step above your head
      rect(R, 7, 15, 15, 17);          // landing, below the screen at k=0
    },
  },
  {
    name: 'FLOOD', axis: 'y', k0: 0, kd: 2, door: { x: 20, y: 2 }, spawn: { x: 3, y: 9 },
    hint: () => `Sinking the red raises the water.`,
    build(R, G, B) {
      rect(R, -4, 10, 7, 17);          // shore
      rect(R, 8, 11, 15, 17);          // pool floor
      rect(B, 8, 9, 15, 17);           // pool
      rect(R, 16, 6, 27, 17);          // cliff, 4 above the shore
      rect(G, 16, 0, 18, 2, BLOCK);
      rect(G, 16, 3, 18, 3, SPIKE_DOWN);
    },
  },
  {
    // Each jump-and-sink climb leaves you ~3 rows higher on screen. Jumping from
    // the second step at k=1 puts your head in the teeth: sink while standing first.
    name: 'STAIRS', axis: 'y', k0: 3, kd: -2, door: { x: 16, y: 2 }, spawn: { x: 2, y: 10 },
    hint: () => `Every climb brings you closer to the teeth. Sink while you stand to make headroom.`,
    build(R, G, B) {
      rect(R, -4, 14, 5, 17);          // floor
      rect(R, 6, 10, 9, 17);           // step 1 (each step 4 rows up)
      rect(R, 10, 6, 13, 17);          // step 2
      rect(R, 14, 2, 27, 17);          // top step with the exit
      rect(G, 6, 0, 13, 0, BLOCK);
      rect(G, 6, 1, 13, 1, SPIKE_DOWN);
    },
  },
  {
    name: 'PRISM', axis: 'x', k0: 0, kd: 2, door: { x: 20, y: 3 }, spawn: { x: 2, y: 11 },
    hint: () => `Everything you've learned, in one room.`,
    build(R, G, B) {
      rect(R, -4, 12, 8, 17);          // start
      rect(B, 4, 3, 6, 11);            // water column
      rect(R, 12, 5, 16, 5);           // first high ledge
      rect(R, 22, 5, 27, 5);           // exit ledge (5-tile gap)
      rect(G, 22, 4, 23, 4);           // spikes past the exit
      rect(G, 9, 13, 21, 13);          // spike pit
    },
  },
];

// The continuation-in-part (endless.js): sheets FIG. 11, 12, ... are generated in the LEVELS format and registered
// here by index (li 10 = FIG. 11). The ten sheets above are never touched.
const CONT = new Map();
const defAt = i => i < LEVELS.length ? LEVELS[i] : CONT.get(i);
const kmaxOf = (d = L) => (d && d.kmax) || KMAX;
let li = 0, L = null, k = 0, kT = 0, p = null, state = 'title', stT = 0, deaths = 0, time = 0, runT = 0;
// The Q/E press in progress: the whole step it started from and its direction (see the keyup handler).
let lensTap = null;
let jumpBuf = 0, resistShake = 0, lastResist = -1, wheelAcc = 0, wheelT = -1, paused = false, deathAt = null;
let wasAligned = false;
// Pixel offset of a layer: s = -1 red, 0 green, +1 blue.
const offs = (s, kk) => [(-PAD + s * kk * L.ax) * T, (-PAD + s * kk * L.ay) * T];

let best = 0;
try { best = clamp(parseInt(localStorage.getItem(SAVE_KEY), 10) || 0, 0, LEVELS.length - 1); } catch (e) { best = 0; }
function saveBest(i) {
  if (i >= LEVELS.length) return;                     // the continuation keeps its own best depth, per serial number
  best = Math.max(best, i);
  if (TEST_MODE || DEMO || VALIDATE) return;
  try { localStorage.setItem(SAVE_KEY, String(best)); } catch (e) { /* private mode: progress just isn't kept */ }
}

function loadLevel(i) {

function onWheel(e) {

  // so a single notch never counts twice.

  if (Math.abs(wheelAcc) >= 40 && time - wheelT > 0.07) {

    if (state === 'title') { coverLens(s, true); return; }

// ?demo: a scripted ~22 s tour keyed to sim steps, so it plays identically in real time and under ?__state=frames:

  Wait(0.55),
  Do('hold Q again (lens +2)', () => press('KeyQ')),
  Wait(0.12),
  Do('release Q: lens snaps to k=2', () => release('KeyQ')),
  Until(() => Math.abs(k - L.kd) < ALIGN_TOL),
  Wait(0.5),
  Do('walk right to the door', () => press('KeyD')),

  Until(() => li === 1 && state === 'play'),
  Wait(0.3),
  Do('walk right to the edge', () => press('KeyD')),
  Until(() => p.x + p.w / 2 >= (7 - k) * T - 2, 'at the edge: jump'),
  Do('jump', () => press('Space')),
  Wait(0.08),
  Do('mid-air: hold Q (lens toward +4): no 10′, dimension line to red', () => press('KeyQ')),
  Wait(4 / 6),
  Do('release Q', () => release('KeyQ')),
  Until(() => p.grounded),
  Do('release jump, keep walking right', () => release('Space')),
  Wait(0.3),
  Do('stop', () => release('KeyD')),
  Wait(0.6),
  Do('standing: hold E (lens back toward +1): 10′ already showed the carry into the spikes', () => press('KeyE')),
  Until(() => state === 'dead'),
  Do('release E', () => release('KeyE')),
  Until(() => state === 'play'),
  Wait(0.7),
  Do('Esc: the Brief Description of the Drawings', () => tap('Escape')),
  Wait(0.9),

  Wait(0.35),
  Do('ArrowDown', () => tap('ArrowDown')),
  Wait(0.8),
  Do('digit 6: cut to FIG. 6 LIFT', () => tap('Digit6')),
  Wait(0.75),
  Do('walk to the tower', () => press('KeyD')),
  Until(() => p.x >= 12 * T - 22, 'at the wall: jump'),

  Wait(2 / 6),
  Do('release E', () => release('KeyE')),
  Until(() => p.grounded && p.x > 12 * T, 'on the tower'),

  Wait(0.35),
  Do('hold Q: 10 rides the tower up five stops; door 18 aligns', () => press('KeyQ')),

// Sim events are logged as they happen, independent of where the script is waiting.
const seen = { state: null, li: -1, grounded: true, aligned: false };
function demoWatch() {

  if (state !== seen.state) dLog(`state -> ${state}${state === 'dead' ? ' (hold 6 frames, circle, ANTICIPATED)' : ''}`);

  update(DT);

window.CD = {
  get k() { return k; }, get kT() { return kT; }, get p() { return p; }, get state() { return state; },
  get li() { return li; }, get deaths() { return deaths; }, get axis() { return L.axis; },

// QA (presentation only): every label's clearances in the last frame, in the jurors' 1440-frame px.
window.__labelAudit = () => {
  if (!L || !fx.placed) return null;

    if (ovl(q.box, rb, JW(12) - e)) v.push('runner<12');

    q.anchors.forEach(a => { const [ex, ey] = nearOn(q.box, a[0], a[1]); if (Math.hypot(ex - a[0], ey - a[1]) < JW(24) - 0.05) v.push('leader<24'); });
    if (q.box[0] < vb[0] || q.box[1] < vb[1] || q.box[0] + q.box[2] > vb[2] || q.box[1] + q.box[3] > vb[3]) v.push('off-frame');
    for (const t of titleObstacles()) if (ovl(q.box, t, 0)) v.push('title');
    for (const b of railLayout().boxes) { const [x, y] = b2w(b[0], b[1]); if (ovl(q.box, [x, y, b[2] / WP.Z, b[3] / WP.Z], JW(12) - e)) v.push('rail<12'); }
    if (sb) {

    }
    if (arc) q.legs.forEach(([ex, ey, x, y]) => { if (arcCross(ex, ey, x, y, arc)) v.push('leader×arc'); });
    if (arc && arcNear(q.box, arc, JW(12) - e)) v.push('arc<12');

    if (sb[1] < vb[1]) v.push('stamp off-frame');

};
// QA (presentation only): the world's placement and the labels last placed, in device px.
window.__wp = () => {

    band: WP.band && [WP.band.top, WP.band.bot].map(v => (VIEW.offY + v * VIEW.S) / css),

if (VALIDATE) {

  paused = true;
  CDX.serve({
    key: (type, code) => dispatchEvent(new KeyboardEvent(type, { code, bubbles: true, cancelable: true })),
    wheel: dy => cv.dispatchEvent(new WheelEvent('wheel', { deltaY: dy, cancelable: true })),
    step: () => update(DT), get p() { return p; }, get k() { return k; }, get state() { return state; },
    get deaths() { return deaths; }, get axis() { return L.axis; },

  const fontReady = (document.fonts && document.fonts.load ? Promise.all([document.fonts.load(bs(100, 900), '0123456789'), document.fonts.load(bs(100, 800), 'FIG.'), document.fonts.load(bs(20, 600), 'a'), document.fonts.load(cp(16, 400), 'a'), document.fonts.load(cp(16, 700), 'a')]) : Promise.resolve())
    .catch(() => {}).then(() => {

}
